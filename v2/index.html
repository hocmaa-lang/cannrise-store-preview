<title>CANNRISE · Brand Store v2 · סימולטור</title>
<style>
:root{--canopy:#1B4332;--growth:#A5B83C;--sand:#EDC97E;--bone:#F8F3E6;--clay:#C97C4C;--ink:#26291F;--amz:#131921;--amz2:#232f3e;--link:#007185;--star:#de7921}
*{box-sizing:border-box}body{margin:0;background:#e9e6df;font-family:Arial,"Segoe UI",sans-serif;color:#0f1111}
button{font:inherit;cursor:pointer}
/* Hebrew control bar */
.ctl{position:sticky;top:0;z-index:50;background:var(--canopy);color:var(--bone);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 18px;font-family:"Segoe UI",Arial,sans-serif;direction:rtl}
.ctl b{font-size:15px;letter-spacing:.02em}.ctl .sp{flex:1}
.seg{display:inline-flex;background:rgba(248,243,230,.12);border-radius:3px;padding:2px}
.seg button{border:0;background:transparent;color:var(--bone);padding:6px 12px;border-radius:2px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--sand);color:var(--ink);font-weight:700}
.ctl small{opacity:.8;font-size:12px}
/* store frame (English, LTR) */
.stage{padding:18px 0 60px;display:flex;justify-content:center}
.shell{direction:ltr;background:#fff;width:100%;max-width:1500px;box-shadow:0 0 0 1px #d5d0c4}
body.mob .shell{max-width:414px;border-radius:26px;overflow:hidden;box-shadow:0 0 0 10px #222,0 0 0 11px #555}
.amzbar{background:var(--amz);color:#fff;display:flex;gap:14px;align-items:center;padding:9px 16px;font-size:12px}
.amzbar b{font-size:19px;letter-spacing:-.03em}.amzbar .s{flex:1;height:30px;background:#fff;border-radius:4px;display:flex;justify-content:flex-end;overflow:hidden}.amzbar .s i{width:42px;background:#febd69}
.amzbar2{height:8px;background:var(--amz2)}
.hero{aspect-ratio:5/1;overflow:hidden;background:#ddd;position:relative}.hero img{width:100%;height:100%;object-fit:cover;display:block}
body.mob .hero{aspect-ratio:2.4/1}
.brandbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #ddd}
.logo{width:84px;height:84px;background:#fff;border:1px solid #ddd;margin-top:-38px;position:relative;z-index:2}.logo img{width:100%;height:100%}
body.mob .logo{width:62px;height:62px;margin-top:-26px}
.brandbar b{font-size:16px}.fo{border:1px solid #888;border-radius:99px;padding:3px 14px;font-size:12px}
.nav{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid #ddd;overflow-x:auto}
.nav button{all:unset;cursor:pointer;font-size:13px;padding:12px 10px;border-bottom:3px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.nav button[aria-current=true]{border-color:var(--canopy);font-weight:700}
.page{display:grid;gap:14px;padding:14px 16px 30px}
body.mob .page{gap:10px;padding:10px}
/* Amazon section grammar */
.sec{position:relative}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.half{display:grid;gap:14px;aspect-ratio:1;min-width:0}
.half.S4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.half.M2{grid-template-rows:1fr 1fr}
.half.MS{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.half.MS>:first-child{grid-column:span 2}
body.mob .two{grid-template-columns:1fr;gap:10px}body.mob .half{gap:10px}
.tile{position:relative;min-width:0;min-height:0;overflow:hidden;background:#f3f0e8;display:block;border:0;padding:0;width:100%;height:100%}
.tile>img{width:100%;height:100%;object-fit:cover;display:block}
.fw .tile{height:auto}.fw .tile>img{height:auto}
a.tile,button.tile{cursor:pointer}button.tile:hover>img{filter:brightness(1.03)}
body.mob .half.M2{aspect-ratio:auto;grid-template-rows:auto}body.mob .half.M2 .tile>img,body.mob .half.MS>:first-child>img{height:auto}
body.mob .half.MS{aspect-ratio:auto;grid-template-rows:auto auto}
.vid{position:relative;aspect-ratio:2/1;background:#000;overflow:hidden}.vid video{width:100%;height:100%;object-fit:cover;display:block}
.tt{background:var(--bone);padding:clamp(18px,3vw,40px) clamp(18px,6vw,120px);text-align:center}
.tt h3{margin:0 0 10px;font-size:22px;font-weight:700}.tt p{margin:0 auto;max-width:860px;font-size:15px;line-height:1.55}
body.mob .tt h3{font-size:18px}body.mob .tt p{font-size:14px}
.gh{font-size:20px;font-weight:700;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
body.mob .grid{grid-template-columns:1fr 1fr;gap:10px}
.pc{display:grid;gap:4px;font-size:13px;align-content:start;min-width:0}
.pc .im{aspect-ratio:1;background:#f7f7f7;display:grid;place-items:center}.pc .im img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
.pc .nm{line-height:1.3;max-height:3.9em;overflow:hidden;color:#0f1111}.pc .rt{color:var(--star);font-size:12px}.pc .rt span{color:var(--link)}
.pc .pr{font-size:18px}.pc .pm{font-size:11px;color:#1a98ff;font-weight:700;font-style:italic}
.ptile{display:grid;grid-template-rows:1fr auto;background:#fff;border:1px solid #e7e7e7;height:100%;min-height:0}
.ptile .im{background:#f7f7f7;display:grid;place-items:center;overflow:hidden;min-height:0}.ptile .im img{max-width:80%;max-height:88%;object-fit:contain;mix-blend-mode:multiply}
.ptile .info{padding:10px 14px;font-size:13px;display:grid;gap:3px}
body.mob .ptile{aspect-ratio:1}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block}
body.mob .gal{grid-template-columns:1fr 1fr}
.foot{display:flex;justify-content:space-between;font-size:12px;color:#565959;padding-top:12px;border-top:1px solid #ddd}
/* build-spec mode */
.lab{display:none}
body.spec .lab{display:block;position:absolute;z-index:5;left:6px;top:6px;right:6px;background:rgba(27,67,50,.94);color:#F8F3E6;font:11px/1.35 Consolas,monospace;padding:6px 8px;border-radius:2px;pointer-events:none;max-height:calc(100% - 12px);overflow:hidden;text-align:left;direction:ltr}
body.spec .lab b{color:#EDC97E;font-size:12px}
.shead{display:none}
body.spec .shead{display:flex;gap:12px;align-items:center;background:#EDC97E;color:#26291F;font:12px Consolas,monospace;padding:5px 10px;margin-bottom:6px;border-radius:2px}
body.spec .shead b{font-size:13px}.season{background:var(--clay);color:var(--ink);padding:1px 6px;border-radius:9px;font-family:Arial;font-size:11px}
.spectbl{display:none}
body.spec .spectbl{display:block;direction:rtl;font-family:"Segoe UI",Arial,sans-serif;padding:0 16px 30px}
.spectbl table{width:100%;border-collapse:collapse;font-size:12px;direction:ltr}
.spectbl th,.spectbl td{border:1px solid #ddd;padding:5px 7px;text-align:left;vertical-align:top}.spectbl th{background:var(--canopy);color:var(--bone)}
.spectbl h3{font-size:16px;margin:18px 0 8px}
@media (max-width:760px){body:not(.mob) .two{grid-template-columns:1fr}body:not(.mob) .grid{grid-template-columns:1fr 1fr}}
</style>

-Large_xsell-home_MOBILE_1680x1680.jpg", "alt": "Three lines, one standard.", "go": "home", "spec": {"type": "Image tile · Large", "size": "1500×1500", "msize": "1680×1680", "file": "production/4_Coco-Grow-Bags/S10-c_Image-Large_xsell-home_1500x1500.jpg", "mfile": "production/4_Coco-Grow-Bags/S10-c_Image-Large_xsell-home_MOBILE_1680x1680.jpg", "src": ["brand: sun_mark.svg / logo / grain (design system)"]}}]}], "layout": "2 Medium | Large"}, {"code": "C99", "kind": "fw", "seasonal": false, "tiles": [{"kind": "img", "code": "C99", "desk": "assets/t/coco_S99_Image-FullWidth_signoff_3000x600.jpg", "mob": "assets/m/coco_S99_Image-FullWidth_signoff_MOBILE_1680x840.jpg", "alt": "Cannrise sun logo with the line Thinking Green.", "go": null, "spec": {"type": "Image tile · full width", "size": "3000×600", "msize": "1680×840", "file": "production/4_Coco-Grow-Bags/S99_Image-FullWidth_signoff_3000x600.jpg", "mfile": "production/4_Coco-Grow-Bags/S99_Image-FullWidth_signoff_MOBILE_1680x840.jpg", "src": ["brand: sun_mark.svg / logo / grain (design system)"]}}], "layout": "Full width"}]}];
let cur='home';const mob=()=>document.body.classList.contains('mob');
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=r=>{r=parseFloat(r)||0;let s='';for(let i=1;i<=5;i++)s+=i<=Math.round(r)?'★':'☆';return s};
const lab=(code,sp)=>`<div class="lab"><b>${code}</b> · ${e(sp.type)}<br>${e(sp.size)}${sp.msize?' · mobile '+e(sp.msize):''}<br>${e(sp.file)}${sp.mfile?'<br>'+e(sp.mfile):''}<br>src: ${e((sp.src||[]).join(' | '))}</div>`;
function tile(t){
 if(t.kind==='product') return `<div class="ptile" style="position:relative"><div class="im"><img src="${t.img}" alt="${e(t.title)}"></div><div class="info"><span>${e(t.title)}</span><span class="rt" style="color:var(--star)">${stars(t.rt)} <span style="color:var(--link)">${e(t.rc)}</span></span><span style="font-size:17px">${e(t.price)} <span style="color:#1a98ff;font-size:11px;font-weight:700;font-style:italic">✓prime</span></span></div>${lab(t.code,t.spec)}</div>`;
 const src=mob()?t.mob:t.desk;const tag=t.go?'button':'div';
 return `<${tag} class="tile" ${t.go?`data-go="${t.go}"`:''}><img src="${src}" alt="${e(t.alt)}" loading="lazy">${lab(t.code,t.spec)}</${tag}>`}
const pc=i=>`<div class="pc"><div class="im"><img src="${i.img}" alt="" loading="lazy"></div><div class="nm">${e(i.title)}</div><div class="rt">${stars(i.rt)} <span>${e(i.rc)}</span></div><div class="pr">${e(i.price)}</div><div class="pm">✓prime</div></div>`;
function sec(s){
 const head=`<div class="shead"><b>${s.code}</b><span>${e(s.layout)}</span>${s.seasonal?'<span class="season">עונתי · להסרה אחרי 25.12</span>':''}</div>`;
 let body='';
 if(s.kind==='fw') body=`<div class="fw">${tile(s.tiles[0])}</div>`;
 else if(s.kind==='two') body=`<div class="two">${s.halves.map(h=>`<div class="half ${h.lay}">${h.tiles.map(tile).join('')}</div>`).join('')}</div>`;
 else if(s.kind==='text') body=`<div class="tt" style="position:relative"><h3>${e(s.h)}</h3><p>${e(s.body)}</p>${lab(s.code,{type:'Text tile · Amazon font',size:'native',file:'—',src:['copy: brand book / identity & voice v1.1']})}</div>`;
 else if(s.kind==='video') body=`<div class="vid"><video autoplay muted loop playsinline preload="metadata" poster="${s.poster}" aria-label="${e(s.alt)}"><source src="${s.src}" type="video/mp4"></video>${lab(s.code,{type:'Background video · muted · no burned-in text',size:'1920×960 · '+s.dur+' s · H.264',file:s.file,src:s.vsrc})}</div>`;
 else if(s.kind==='grid') body=`<div style="position:relative" id="grid"><div class="gh">${e(s.title)}</div><div class="grid">${s.items.map(pc).join('')}</div>${lab(s.code,{type:'Product grid',size:s.items.length+' ASINs',file:s.items.map(i=>i.asin).join(', '),src:['Amazon catalogue']})}</div>`;
 else if(s.kind==='gallery') body=`<div style="position:relative"><div class="gal">${s.imgs.map(i=>`<img src="${i}" alt="${e(s.alt)}" loading="lazy">`).join('')}</div>${lab(s.code,{type:'Gallery · '+s.imgs.length+' images',size:s.size+' each',file:s.files.join(' | '),src:s.src})}</div>`;
 return `<section class="sec">${head}${body}</section>`}
function specTable(p){
 const rows=[];rows.push(['Header','Store header · no logo','3000×600',p.hfile,'—',p.hsrc.join(' | ')]);
 p.sections.forEach(s=>{
  const ts=s.tiles||(s.halves?s.halves.flatMap(h=>h.tiles):null);
  if(ts) ts.forEach(t=>rows.push([t.code,t.spec.type+' ('+s.layout+')',t.spec.size+(t.spec.msize?' / m '+t.spec.msize:''),t.spec.file,t.spec.mfile||'—',(t.spec.src||[]).join(' | ')]));
  else if(s.kind==='text') rows.push([s.code,'Text tile','native','—','—',s.h]);
  else if(s.kind==='video') rows.push([s.code,'Background video','1920×960 · '+s.dur+' s',s.file,'—',s.vsrc.join(' | ')]);
  else if(s.kind==='grid') rows.push([s.code,'Product grid','native',s.items.map(i=>i.asin).join(', '),'—','Amazon']);
  else if(s.kind==='gallery') rows.push([s.code,'Gallery',s.size,s.files.join(' | '),'—',s.src.join(' | ')]);
 });
 return `<h3>מפרט בנייה · ${e(p.name)} · ${p.sections.length} סקשנים (מקסימום 20)</h3><table><tr><th>Code</th><th>Amazon tile</th><th>Size</th><th>Desktop file</th><th>Mobile file</th><th>Source</th></tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${e(c)}</td>`).join('')}</tr>`).join('')}</table>`}
function go(id,keep){
 if(id==='#grid'||id.startsWith('#')){const g=document.getElementById('grid')||document.querySelector('.ptile');if(g)g.scrollIntoView({behavior:'smooth',block:'start'});return}
 const p=M.find(x=>x.id===id);if(!p)return;cur=id;
 document.getElementById('hero').innerHTML=`<img src="${p.header}" alt="">${lab(p.id[0].toUpperCase()+'00',{type:'Store header · no logo',size:'3000×600',file:p.hfile,src:p.hsrc})}`;
 document.getElementById('nav').innerHTML=M.map(x=>`<button data-go="${x.id}" aria-current="${x.id===id}">${e(x.name)}</button>`).join('');
 document.getElementById('page').innerHTML=p.sections.map(sec).join('')+`<div class="foot"><span>Cannrise</span><span>Share</span></div>`;
 document.getElementById('spectbl').innerHTML=specTable(p);
 document.querySelectorAll('video').forEach(v=>{v.muted=true;const r=v.play();if(r&&r.catch)r.catch(()=>{})});
 if(!keep)window.scrollTo({top:0})}
document.addEventListener('click',ev=>{
 const d=ev.target.closest('[data-dev]');if(d){document.body.classList.toggle('mob',d.dataset.dev==='m');document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',b===d));go(cur,true);return}
 const m=ev.target.closest('[data-mode]');if(m){document.body.classList.toggle('spec',m.dataset.mode==='spec');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b===m));return}
 const g=ev.target.closest('[data-go]');if(g){ev.preventDefault();go(g.dataset.go)}});
const q=new URLSearchParams(location.search);if(q.get('dev')==='m')document.body.classList.add('mob');if(q.get('mode')==='spec')document.body.classList.add('spec');
document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.dev==='m')===document.body.classList.contains('mob')));
document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.mode==='spec')===document.body.classList.contains('spec')));
go(q.get('p')||'home');
</script>
